name: Update X posts

on:
  push:
    paths: ["x-links.txt"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Fetch X posts
        run: node scripts/update-x-posts.mjs

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.js x-posts-cache.json images
          git diff --cached --quiet || (git commit -m "Update X posts" && git pull --rebase && git push)

      - name: Trigger Pages build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true