<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bundle layout options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a14;--surface:#0d1630;--surface2:#121d3c;--bd:rgba(134,197,255,.16);--text:#eaf1ff;--muted:#9fb0d0;--acc:#4aa3ff;--red:#ff5c5c;--green:#1fae6c;--orange:#ff8a3d;--disp:"Bricolage Grotesque",system-ui,sans-serif;--main:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(74,163,255,.14),transparent 50%),var(--bg);color:var(--text);font:500 16px/1.5 var(--main)}
.wrap{max-width:1180px;margin:0 auto;padding:2.5rem 1.25rem 5rem}
h1{font:800 clamp(2rem,5vw,3rem)/1.05 var(--disp);letter-spacing:-.03em;margin:0 0 .5rem}
.lead{color:var(--muted);max-width:44rem;margin:0 0 2.5rem}
.opt{margin:0 0 4rem}
.opt-head{display:flex;gap:1rem;align-items:flex-start;margin-bottom:1.25rem}
.num{flex:none;display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:12px;background:var(--acc);color:#04101f;font:800 1.3rem var(--disp)}
.opt-head h2{margin:0;font:800 1.5rem var(--disp);letter-spacing:-.02em}
.opt-head p{margin:.15rem 0 0;color:var(--muted);font-size:.93rem;max-width:46rem}
/* shared bits */
.t{position:relative;display:grid;place-items:center;width:var(--w,4.2rem);height:var(--h,3.2rem);border-radius:9px;border:1px solid rgba(255,255,255,.24);background:linear-gradient(135deg,rgba(var(--c),.75),rgba(var(--c),.25));box-shadow:0 8px 14px -6px rgba(0,0,0,.85);font-size:.58rem;font-weight:800;color:rgba(255,255,255,.85);text-align:center;line-height:1.1;padding:.2rem}
.t .q{position:absolute;right:-.3rem;bottom:-.35rem;padding:0 .4rem;border-radius:99px;background:rgb(var(--c));color:#04101f;font-size:.72rem;line-height:1.3rem;box-shadow:0 0 0 2px var(--surface)}
.old{position:relative;display:inline-block;color:#ff6b6b;font:800 1.5rem/1 var(--disp);letter-spacing:-.02em}
.old::after{content:"";position:absolute;left:-.25rem;right:-.25rem;top:50%;height:3px;border-radius:2px;background:#ff3d3d;box-shadow:0 0 10px rgba(255,61,61,.7);transform:rotate(-14deg)}
.oldr{color:#ff8d8d;text-decoration:line-through;text-decoration-color:#ff3d3d;text-decoration-thickness:2px;font-weight:700;font-size:.85rem}
.new{color:#fff;font:800 2.4rem/.95 var(--disp);letter-spacing:-.04em;text-shadow:0 0 24px rgba(var(--c),.7)}
.rb{display:inline-flex;align-items:center;gap:.25rem}
.ri{width:.95em;height:.95em}
.lab{display:block;font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.2rem}
.pill{display:inline-flex;gap:.45rem;align-items:baseline;padding:.3rem .7rem;border:1px solid rgba(64,200,140,.55);border-radius:9px;background:rgba(64,200,140,.14);color:#c9ffe6;font-size:.82rem;font-weight:600;white-space:nowrap}
.pill b{color:#7ff0b8;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.15rem;border-radius:11px;background:var(--acc);color:#04101f;font-weight:800;text-decoration:none;border:0;cursor:pointer;font-family:inherit;font-size:.92rem}
.pbox{border-radius:12px;padding:.7rem .85rem}
.pold{border:1.5px dashed rgba(255,92,92,.65);background:rgba(255,70,70,.1)}
.pold .lab{color:#ff7d7d}
.pnew{border:1.5px solid rgba(var(--c),.7);background:linear-gradient(160deg,rgba(var(--c),.3),rgba(var(--c),.1));box-shadow:0 0 36px -14px rgb(var(--c))}
.pnew .lab{color:rgb(var(--c));filter:brightness(1.35)}
.card{background:var(--surface);border:1px solid rgba(var(--c),.32);border-radius:18px}
.arrow{color:var(--muted);font-weight:800}
/* 1 equation rows */
.eq{display:grid;gap:.9rem}
.eq-row{--c:var(--cc);display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.25rem;padding:1.1rem 1.25rem}
.eq-name{flex:0 0 100%;display:flex;align-items:baseline;gap:.7rem}
.eq-name h3{margin:0;font:800 1.2rem var(--disp)}
.eq-name span{color:var(--muted);font-size:.88rem}
.slots{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.slot{display:grid;justify-items:center;gap:.4rem;width:5.6rem;text-align:center;font-size:.72rem;line-height:1.2;color:var(--muted)}
.slot strong{color:var(--text);font-size:.78rem}
.op{font:800 1.5rem var(--disp);color:var(--muted)}
.eq-price{display:flex;align-items:center;gap:.7rem;margin-left:auto;flex-wrap:wrap}
.eq-price .new{font-size:2.2rem}
/* 2 landscape carousel */
.car{position:relative}
.track{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:.4rem 0 1rem}
.track::-webkit-scrollbar{display:none}
.lc{--c:var(--cc);flex:0 0 calc(50% - .5rem);scroll-snap-align:start;display:grid;grid-template-columns:.9fr 1.3fr;overflow:hidden}
.lc-art{position:relative;display:grid;place-items:center;min-height:15rem;background:radial-gradient(circle at 80% 0,rgba(var(--c),.38),transparent 60%),radial-gradient(rgba(var(--c),.3) 1px,transparent 1.6px) 0 0/14px 14px,linear-gradient(135deg,#10204a,#08112a)}
.lc-art .fan{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.lc-art .fan .t{--w:5.6rem;--h:3.2rem}
.lc-off{position:absolute;top:.7rem;left:.7rem;background:var(--green);color:#fff;font:800 .95rem var(--disp);padding:.2rem .6rem;border-radius:8px;transform:rotate(-4deg)}
.lc-body{padding:1.1rem 1.2rem;display:grid;gap:.7rem;align-content:start}
.lc-body h3{margin:0;font:800 1.25rem var(--disp)}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:.25rem;font-size:.86rem}
.mini li{display:flex;gap:.5rem;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.1);padding-bottom:.25rem}
.mini li span:last-child{color:var(--muted);font-weight:700}
.deal{display:grid;grid-template-columns:1fr auto 1.2fr;gap:.4rem;align-items:stretch}
.deal .arrow{display:grid;place-items:center}
.nav{display:flex;gap:.6rem;justify-content:center}
.nbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:rgba(10,18,40,.85);color:var(--text);cursor:pointer;font-size:1.1rem}
/* 3 shop selector */
.shop{display:grid;grid-template-columns:17rem 1fr;gap:1rem}
.tabs{display:grid;gap:.6rem;align-content:start}
.tab{--c:var(--cc);display:flex;align-items:center;gap:.7rem;text-align:left;padding:.8rem .9rem;border-radius:14px;border:1px solid var(--bd);background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.tab.on{border-color:rgba(var(--c),.8);background:linear-gradient(160deg,rgba(var(--c),.22),var(--surface));box-shadow:0 0 30px -14px rgb(var(--c))}
.tab b{display:block;font:800 .98rem var(--disp)}
.tab small{color:var(--muted);font-size:.78rem}
.tab .p{margin-left:auto;text-align:right;font:800 1.05rem var(--disp)}
.tab .p i{display:block;font:700 .66rem var(--main);font-style:normal;color:#7ff0b8}
.panel{--c:var(--cc);padding:1.4rem;display:grid;grid-template-columns:1.1fr 1fr;gap:1.4rem}
.panel h3{margin:0;font:800 1.6rem var(--disp);letter-spacing:-.02em}
.panel .art{display:flex;flex-wrap:wrap;gap:1.1rem;margin:1rem 0}
.panel .art .t{--w:6.6rem;--h:4.6rem}
.panel .right{display:grid;gap:.8rem;align-content:start}
/* 4 table */
.tbl{display:grid;gap:.6rem}
.tr{--c:var(--cc);display:grid;grid-template-columns:1.2fr 1.5fr .8fr .9fr .9fr auto;gap:1rem;align-items:center;padding:.9rem 1.1rem}
.th{color:var(--muted);font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:0 1.1rem}
.tr h3{margin:0;font:800 1.05rem var(--disp)}
.tr h3 small{display:block;color:var(--muted);font:500 .78rem var(--main)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.tr .new{font-size:1.7rem}
@media(max-width:960px){
.lc{flex-basis:88%;grid-template-columns:1fr}.lc-art{min-height:9rem}
.shop{grid-template-columns:1fr}.panel{grid-template-columns:1fr}.tabs{grid-template-columns:1fr 1fr}
.th{display:none}.tr{grid-template-columns:1fr 1fr}.tr>*:nth-child(2){grid-column:1/-1}.eq-price{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bundle layout options</h1>
  <p class="lead">Four horizontal directions for the bundles, using your real bundles and prices. The artwork tiles are placeholders (your real images will replace them). Numbers use the US style: <b>$30.00</b> and <b>8,000</b> Robux. Tell me the number you like, or mix and match.</p>
  <div id="app"></div>
</div>
<script>
var B=[
{n:"YouTuber Starter Pack",d:"Everything a new channel needs to look pro.",c:"74,163,255",bu:60,br:15000,i:[["Profile Picture",1,10,2500],["YouTube Banner",1,20,5000],["YouTube Thumbnail",2,20,5000]]},
{n:"Game Launch Pack",d:"Thumbnails and icon for a game release.",c:"150,130,255",bu:75,br:20500,i:[["Game Thumbnail",2,30,8000],["Game Icon",1,25,7500]]},
{n:"Hire Me Kit",d:"Ads and a commission sheet to find clients.",c:"255,150,60",bu:50,br:12500,i:[["Ad / Poster",2,20,5000],["Commission Sheet",1,20,5000]]},
{n:"Render Pack",d:"Three clean renders for your collection.",c:"64,200,140",bu:17,br:5000,i:[["Render",3,7,2000]]}];
B.forEach(function(b){b.ru=0;b.rr=0;b.i.forEach(function(x){b.ru+=x[1]*x[2];b.rr+=x[1]*x[3]});b.su=b.ru-b.bu;b.sr=b.rr-b.br;b.p=Math.round(b.su/b.ru*100)});
var RI='<svg class="ri" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5z" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="6" y="6" width="4" height="4" rx=".6" fill="currentColor"/></svg>';
var $=function(n){return"$"+n.toFixed(2)},R=function(n){return n.toLocaleString("en-US")};
var rb=function(n){return'<span class="rb">'+RI+R(n)+"</span>"};
var tile=function(x,q){return'<span class="t">'+x[0]+(q>1?'<span class="q">'+q+"×</span>":"")+"</span>"};
var sty=function(b){return' style="--cc:'+b.c+';--c:'+b.c+'"'};
var save=function(b){return'<span class="pill"><b>Save '+$(b.su)+"</b> "+b.p+"% off · "+rb(b.sr)+"</span>"};
var go='<a class="btn" href="#">Commission this bundle →</a>';
var price=function(b,big){return'<div class="pbox pold"><span class="lab">Separately</span><span class="old">'+$(b.ru)+'</span><br><span class="oldr rb">'+RI+R(b.rr)+'</span></div><span class="arrow">→</span><div class="pbox pnew"><span class="lab">Bundle price</span><span class="new">'+$(b.bu)+'</span><br><span class="rb" style="font-weight:800">'+RI+R(b.br)+"</span></div>"};
function head(n,t,d){return'<div class="opt-head"><span class="num">'+n+'</span><div><h2>'+t+"</h2><p>"+d+"</p></div></div>"}

// 1 equation rows
var h1=head(1,"Equation rows","Each bundle reads like a sum: pieces + pieces = price. Old price in red, new price big. All four visible at once, no carousel.")+'<div class="eq">';
B.forEach(function(b){
  var slots=b.i.map(function(x){return'<div class="slot">'+tile(x,x[1])+"<strong>"+x[0]+(x[1]>1?"s":"")+"</strong>"+$(x[1]*x[2])+"</div>"}).join('<span class="op">+</span>');
  h1+='<div class="card eq-row"'+sty(b)+'><div class="eq-name"><h3>'+b.n+"</h3><span>"+b.d+'</span></div><div class="slots">'+slots+'</div><span class="op">=</span><div class="eq-price"><div class="pbox pold" style="text-align:center"><span class="lab">Separately</span><span class="old">'+$(b.ru)+'</span></div><div class="pbox pnew" style="text-align:center"><span class="lab">Bundle</span><span class="new">'+$(b.bu)+'</span><br><span class="rb" style="font-weight:800">'+RI+R(b.br)+"</span></div><div style=\"display:grid;gap:.5rem\">"+save(b)+go+"</div></div></div>"});
h1+="</div>";

// 2 landscape cards
var h2=head(2,"Landscape card carousel","Two wide cards at a time. Artwork on the left, contents and the red-to-new price on the right. Scroll or use the arrows.")+'<div class="car"><div class="track" id="trk">';
B.forEach(function(b){
  h2+='<div class="card lc"'+sty(b)+'><div class="lc-art"><span class="lc-off">-'+b.p+'%</span><div class="fan">'+b.i.map(function(x){return tile(x,x[1])}).join("")+'</div></div><div class="lc-body"><h3>'+b.n+'</h3><ul class="mini">'+b.i.map(function(x){return"<li><span>"+x[1]+"× "+x[0]+"</span><span>"+$(x[1]*x[2])+"</span></li>"}).join("")+'</ul><div class="deal">'+price(b)+"</div>"+save(b)+go+"</div></div>"});
h2+='</div><div class="nav"><button class="nbtn" onclick="trk.scrollBy({left:-trk.clientWidth/2,behavior:\'smooth\'})" aria-label="Previous">←</button><button class="nbtn" onclick="trk.scrollBy({left:trk.clientWidth/2,behavior:\'smooth\'})" aria-label="Next">→</button></div></div>';

// 3 shop selector
var h3=head(3,"Shop selector","Pick a bundle on the left, see everything about it on the right. Click the tabs to try it.")+'<div class="shop"><div class="tabs" id="tabs"></div><div class="card panel" id="panel"></div></div>';

// 4 table
var h4=head(4,"Menu-board table","One row per bundle so you can compare all four at a glance. Collapses into stacked rows on phones.")+'<div class="tbl"><div class="tr th"><span>Bundle</span><span>What\u2019s inside</span><span>Separately</span><span>Bundle price</span><span>You save</span><span></span></div>';
B.forEach(function(b){
  h4+='<div class="card tr"'+sty(b)+'><h3>'+b.n+"<small>"+b.i.reduce(function(s,x){return s+x[1]},0)+" pieces</small></h3><div class=\"chips\">"+b.i.map(function(x){return tile(x,x[1])}).join("")+'</div><div><span class="old" style="font-size:1.2rem">'+$(b.ru)+'</span><br><span class="oldr rb">'+RI+R(b.rr)+'</span></div><div><span class="new" style="--c:'+b.c+'">'+$(b.bu)+'</span><br><span class="rb" style="font-weight:800;font-size:.85rem">'+RI+R(b.br)+'</span></div><div><span class="pill"><b>'+$(b.su)+"</b> "+b.p+"%</span></div>"+go.replace("Commission this bundle →","Commission")+"</div>"});
h4+="</div>";

document.getElementById("app").innerHTML=['<section class="opt">'+h1+"</section>",'<section class="opt">'+h2+"</section>",'<section class="opt">'+h3+"</section>",'<section class="opt">'+h4+"</section>"].join("");

function show(k){
  var b=B[k];
  tabs.innerHTML=B.map(function(x,j){return'<button class="tab'+(j===k?" on":"")+'" style="--cc:'+x.c+'" onclick="show('+j+')"><span><b>'+x.n+"</b><small>"+x.i.reduce(function(s,y){return s+y[1]},0)+' pieces</small></span><span class="p">'+$(x.bu)+"<i>save "+x.p+"%</i></span></button>"}).join("");
  panel.setAttribute("style","--cc:"+b.c+";--c:"+b.c);
  panel.innerHTML='<div><h3>'+b.n+'</h3><p style="color:var(--muted);margin:.3rem 0 0">'+b.d+'</p><div class="art">'+b.i.map(function(x){return tile(x,x[1])}).join("")+'</div><ul class="mini">'+b.i.map(function(x){return"<li><span>"+x[1]+"× "+x[0]+" ("+$(x[2])+" each)</span><span>"+$(x[1]*x[2])+"</span></li>"}).join("")+'</ul></div><div class="right"><div class="deal">'+price(b)+"</div>"+save(b)+go+"</div>";
}
show(0);
</script>
</body>
</html>
